name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}

    steps:
      - name: Obter o histórico
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classificar o escopo
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "Execução manual: validação completa." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${BASE_SHA}"
          else
            base_sha="${BEFORE_SHA}"
          fi

          if [[ -z "${base_sha}" || \
                "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "Base indisponível: validação completa." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git diff --check "${base_sha}" "${HEAD_SHA}"

          full=false
          while IFS= read -r -d '' changed_file; do
            echo "- \`${changed_file}\`" >> "${GITHUB_STEP_SUMMARY}"
            case "${changed_file}" in
              .github/actions/*|.github/workflows/*|.github/texlive-packages|\
              examples/*|scripts/*|source/*|testfiles/*|\
              build.lua|manifest.txt|\
              *.bib|*.dtx|*.ins|*.lua|*.sh|*.sty|*.tex)
                full=true
                ;;
            esac
          done < <(git diff --name-only -z "${base_sha}" "${HEAD_SHA}")

          echo "full=${full}" >> "${GITHUB_OUTPUT}"
          if [[ "${full}" == "true" ]]; then
            echo "Escopo técnico: validação completa." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Escopo documental: validação rápida." >> "${GITHUB_STEP_SUMMARY}"
          fi

  tests:
    name: TeX Live ${{ matrix.texlive }}
    runs-on: ubuntu-latest
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        texlive:
          - 2024
          - 2025
          - 2026

    steps:
      - name: Verificar a detecção de mudanças
        if: needs.changes.result != 'success'
        run: |
          echo "A detecção de mudanças falhou." >&2
          exit 1

      - name: Registrar validação documental
        if: >-
          needs.changes.result == 'success' &&
          needs.changes.outputs.full != 'true'
        run: |
          echo "Nenhum arquivo técnico foi alterado; suíte TeX dispensada."

      - name: Obter o código
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@v6

      - name: Testar com LuaLaTeX
        if: needs.changes.outputs.full == 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: ${{ matrix.texlive }}
          scheme: full
          run: |
            apk add --no-cache diffutils
            l3build check --halt-on-error

  portability:
    name: Portabilidade — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Verificar a detecção de mudanças
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo "A detecção de mudanças falhou." >&2
          exit 1

      - name: Registrar validação documental
        if: >-
          needs.changes.result == 'success' &&
          needs.changes.outputs.full != 'true'
        shell: bash
        run: echo "Nenhum arquivo técnico foi alterado; portabilidade dispensada."

      - name: Obter o código
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@v6

      - name: Instalar TeX Live 2026
        if: needs.changes.outputs.full == 'true'
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: 2026
          package-file: .github/texlive-packages

      - name: Executar a suíte com LuaLaTeX
        if: needs.changes.outputs.full == 'true'
        run: l3build check --halt-on-error

  quality:
    name: Qualidade do PDF e desempenho
    runs-on: ubuntu-latest
    needs: changes
    if: always()

    steps:
      - name: Verificar a detecção de mudanças
        if: needs.changes.result != 'success'
        run: |
          echo "A detecção de mudanças falhou." >&2
          exit 1

      - name: Registrar validação documental
        if: >-
          needs.changes.result == 'success' &&
          needs.changes.outputs.full != 'true'
        run: echo "Nenhum arquivo técnico foi alterado; auditoria dispensada."

      - name: Obter o código
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@v6

      - name: Auditar PDF, mensagens, desempenho e regressão visual
        if: needs.changes.outputs.full == 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          scheme: full
          run: |
            apk add --no-cache bash diffutils imagemagick poppler-utils qpdf
            ./scripts/quality-audit.sh

      - name: Guardar métricas de qualidade
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: abntex3-metricas-qualidade
          path: build/quality/metrics.txt
          if-no-files-found: error
          retention-days: 30

  distribution:
    name: Distribuição de ensaio
    runs-on: ubuntu-latest
    needs:
      - changes
      - tests
      - portability
      - quality
    if: always()

    steps:
      - name: Verificar as dependências
        if: >-
          needs.changes.result != 'success' ||
          needs.tests.result != 'success' ||
          needs.portability.result != 'success' ||
          needs.quality.result != 'success'
        run: |
          echo "A detecção de mudanças ou a suíte TeX falhou." >&2
          exit 1

      - name: Registrar validação documental
        if: >-
          needs.changes.result == 'success' &&
          needs.tests.result == 'success' &&
          needs.changes.outputs.full != 'true'
        run: |
          echo "Nenhum arquivo técnico foi alterado; distribuição dispensada."

      - name: Obter o código
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@v6

      - name: Gerar e validar a distribuição
        if: needs.changes.outputs.full == 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          scheme: full
          run: |
            apk add --no-cache diffutils unzip
            l3build ctan
            ./scripts/validate-distribution.sh

      - name: Guardar o pacote CTAN de ensaio
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: abntex3-ctan-ensaio
          path: abntex3-ctan.zip
          if-no-files-found: error
          retention-days: 14
